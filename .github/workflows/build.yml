name: Compile Kernel MIUI 14 - POCO F4 GT (Ingres)

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel source repo URL for ingres (Melt Kernel)."
        required: true
        type: string
        default: "https://github.com/kingD2N/kernel_source_Melt_xiaomi_ingres"

      kernel_branch:
        description: "Branch on kernel_source above. Default MIUI_HOS = tree yang sudah diaudit (config vendor/ingres_GKI.config sudah digabung dgn 426-baris config resmi Xiaomi ingres-s-oss)."
        required: true
        type: choice
        default: "MIUI_HOS"
        options :
           - MIUI_HOS
           - LazyGoogle_ORI
           - melt-rebase-4LazyGoogle
           - melt-MIX
           
      devicetree_branch:
        description: "Branch for the Ingres-Centre devicetrees repo. WAJIB tetap diisi -- arch/arm64/boot/dts/vendor di kernel_source manapun (termasuk rilis resmi Xiaomi ingres-s-oss) memang kosong, jadi ini satu-satunya sumber devicetree yang lengkap. Repo ini defaultnya lineage-23.0, NOT lineage-23.2 - double check before running."
        required: true
        type: string
        default: "lineage-23.2"

      ksu_type:
        description: "KernelSU Version"
        required: true
        type: choice
        default: "KernelSU-Next"
        options:
          - None
          - Official-KernelSU
          - KernelSU-Next
          - KowSU
          - ReSukiSU
          - SukiSUUltra

      custom_name:
        description: "kernel"
        required: false
        type: choice
        default: 5.10.267-MIUI14™-KERNEL
        options:
          - MIUI14™-KERNEL
          - Melt-KERNEL
          - MIX™-KERNEL
          - LazyGoogle-KERNEL

      susfs:
        description: "Add susfs support"
        required: true
        type: boolean
        default: true

      susfs_commit:
        description: "Custom commit SHA for susfs4ksu (optional; leave empty to use the latest commit on gki-android12-5.10)"
        required: false
        type: string
        default: ""

      BBG:
        description: "Add BBG support"
        required: true
        type: boolean
        default: true

      rekernel_netlink:
        description: "Add Re-Kernel support (Netlink)"
        required: true
        type: boolean
        default: true

      rekernel_ebpf:
        description: "Add Re-Kernel support (eBPF)"
        required: true
        type: boolean
        default: true

      droidspaces:
        description: "Add DroidSpaces support"
        required: true
        type: boolean
        default: true

      nomount:
        description: "Add NoMount support (kernel VFS path redirection/injection, kingD2N/nomount - research/dev project per upstream README; may conflict with susfs since both patch fs/namei.c)"
        required: true
        type: boolean
        default: true

      ccache_update:
        description: "Refresh ccache (overwrite the repo cache with this build's ccache; enable when u changed configs/source or need a clean cache)"
        required: true
        type: boolean
        default: true


jobs:
  Build_Kernel:
    env:
        GH_TOKEN: ${{ github.token }}
        SOC: sm8450
        CCACHE_KEY: ccache-ecsv3-ingres-sm8450
        # Public link of your Telegram group (shown as "JOIN" button in the push).
        TG_GROUP_URL: ""
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@v7

      - name: Free up disk space
        run: |
          # Kernel build + 16GB swap file + multiple repo clones can exceed
          # the ~14GB free disk on a standard GitHub-hosted runner, causing
          # "No space left on device" mid-build. Removing preinstalled
          # toolchains we don't use reclaims tens of GB up front.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Setup SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          bc bison flex \
          libssl-dev \
          libelf-dev \
          libdw-dev \
          build-essential \
          lz4 \
          git \
          python3 \
          curl \
          dwarves \
          cpio \
          ccache \
          zstd \
          unzip \
          gcc-aarch64-linux-gnu

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" "${{ inputs.kernel_source }}" ${SOC}

          # The Ingres-Centre devicetrees fork currently defaults to a different
          # branch than kernel_source above (lineage-23.0 vs lineage-23.2),
          # so try the requested branch first and fall back to the repo's own
          # default branch if it isn't there. This mirrors the LineageOS kernel
          # manifest path for this repo: arch/arm64/boot/dts/vendor.
          rm -rf ${SOC}/arch/arm64/boot/dts/vendor
          git clone --depth=1 -b ${{ inputs.devicetree_branch }} https://github.com/Ingres-Centre/android_kernel_xiaomi_${SOC}-devicetrees.git ${SOC}/arch/arm64/boot/dts/vendor \
            || git clone --depth=1 https://github.com/Ingres-Centre/android_kernel_xiaomi_${SOC}-devicetrees.git ${SOC}/arch/arm64/boot/dts/vendor

      - name: Terapkan ulang override melt-MIX (anti-regresi config)
        run: |
          # ingres_GKI.config sudah 2x kehilangan CONFIG_MI_CHARGER_M81 dan
          # override ARCH_CAPE/ARCH_DIWALI setiap kali di-sync ulang dari
          # source resmi Xiaomi. apply_melt_overrides.sh (idempotent, sudah
          # diuji 4 skenario) memastikan ini otomatis benar tiap build,
          # tidak lagi bergantung diingat manual sebelum push.
          bash "${{ github.workspace }}/apply_melt_overrides.sh" "${SOC}/arch/arm64/configs/vendor/ingres_GKI.config"

      - name: Download LLVM (latest stable release)
        run: |
          mkdir -p toolchains
          cd toolchains

          # Auto-detect the latest stable (non-draft, non-prerelease) LLVM
          # release via gh CLI - already authenticated through the job-level
          # GH_TOKEN above, so this doesn't hit the unauthenticated API rate
          # limit. This replaces a hardcoded version so the workflow doesn't
          # need manual edits every time upstream cuts a new release.
          LLVM_TAG=$(gh release list --repo llvm/llvm-project --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          if [[ -z "$LLVM_TAG" ]]; then
            echo "::error::Could not determine the latest llvm/llvm-project release tag via gh CLI."
            exit 1
          fi
          LLVM_VERSION="${LLVM_TAG#llvmorg-}"
          echo "==> Latest LLVM release: ${LLVM_TAG} (version ${LLVM_VERSION})"
          echo "LLVM_VERSION=${LLVM_VERSION}" >> $GITHUB_ENV

          ASSET="LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
          URL="https://github.com/llvm/llvm-project/releases/download/${LLVM_TAG}/${ASSET}"
          if ! wget -q "$URL"; then
            echo "::error::Failed to download ${URL} - ${LLVM_TAG} may not publish a Linux-X64 tarball under the expected name. Check https://github.com/llvm/llvm-project/releases/tag/${LLVM_TAG} for the actual asset name."
            exit 1
          fi

          # Version-agnostic folder name (not "llvm-${LLVM_VERSION}") so
          # CLANG_ROOT below never needs updating when the version changes.
          mkdir llvm
          tar -xf "${ASSET}" -C llvm --strip-components=1

      # ---- ccache-ECS (cctv18 style layered ccache) ----
      - name: Configure ccache dir and key
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_ingres" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          if [[ "${{ inputs.droidspaces }}" == true ]]; then
            CCACHE_REAL_KEY=${CCACHE_KEY}-Droidspaces
          else
            CCACHE_REAL_KEY=${CCACHE_KEY}-none
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> $GITHUB_ENV

      - name: Purge old ccache (on refresh)
        if: ${{ inputs.ccache_update }}
        continue-on-error: true
        run: |
          echo "Deleting old repo ccache to force a fresh save..."
          gh cache delete "${CCACHE_REAL_KEY}-${{ runner.os }}-${{ inputs.kernel_branch }}" -R ${{ github.repository }} || echo "No old ccache to delete"

      - name: Restore ccache
        uses: actions/cache/restore@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ inputs.kernel_branch }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: Compile Kernel
        run: |
          CLANG_ROOT="${GITHUB_WORKSPACE}/toolchains/llvm/bin"
          export PATH="${CLANG_ROOT}:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC="${CLANG_ROOT}/clang"
          export CXX="${CLANG_ROOT}/clang++"
          export HOSTCC="${CLANG_ROOT}/clang"
          export HOSTCXX="${CLANG_ROOT}/clang++"
          export LD="${CLANG_ROOT}/ld.lld"
          export AR="${CLANG_ROOT}/llvm-ar"
          export NM="${CLANG_ROOT}/llvm-nm"
          export OBJCOPY="${CLANG_ROOT}/llvm-objcopy"
          export OBJDUMP="${CLANG_ROOT}/llvm-objdump"
          export STRIP="${CLANG_ROOT}/llvm-strip"
          export KBUILD_BUILD_USER="KingD2N"
          export KBUILD_BUILD_HOST="Ingres"

          # ccache-ECS tuning: normalize paths/timestamps so cache hits across runs
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${GITHUB_WORKSPACE}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          mkdir -p "${CCACHE_DIR}"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "${CCACHE_DIR}/ccache.conf"
          ccache -M "${CCACHE_MAXSIZE}"
          ccache -o compression=true
          echo "ccache status before build:"
          ccache -s

          if [[ -n "${{ inputs.custom_name }}" ]]; then
            KERNEL_NAME="${{ inputs.custom_name }}"
          else
            KERNEL_NAME="${{ inputs.ksu_type }}"
          fi

          echo "KERNEL_NAME=${KERNEL_NAME}" >> $GITHUB_ENV

          cd ${SOC}

          case "${{ inputs.ksu_type }}" in

            "None")
              ;;

            "Official-KernelSU")
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
              ;;

            "KowSU")
               curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/main/kernel/setup.sh" | bash -s master
              ;;

            "KernelSU-Next")
              if [[ "${{ inputs.susfs }}" == true ]]; then
                curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
              else
                curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev
              fi
              ;;

            "ReSukiSU")
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
              ;;

            "SukiSUUltra")
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
              ;;
          esac

          if [[ "${{ inputs.susfs }}" == true ]]; then
            # Full clone (no --depth) so any commit in this branch's history
            # can be checked out below, not just the branch tip. If
            # susfs_commit is left empty, we just stay on the tip (latest).
            git clone -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git susfs
            cd susfs

            if [[ -n "${{ inputs.susfs_commit }}" ]]; then
              echo "==> SUSFS: pinning to custom commit ${{ inputs.susfs_commit }}"
              git checkout "${{ inputs.susfs_commit }}"
            else
              echo "==> SUSFS: using latest commit on branch gki-android12-5.10"
            fi

            SUSFS_COMMIT=$(git rev-parse --short HEAD)
            echo "SUSFS_COMMIT=${SUSFS_COMMIT}" >> $GITHUB_ENV
            echo "==> SUSFS: checked out commit ${SUSFS_COMMIT}"
            cp ./kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ..
            cp ./kernel_patches/fs/* ../fs/
            cp ./kernel_patches/include/linux/* ../include/linux/
            cd ..
            patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch
            echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> arch/arm64/configs/gki_defconfig
          fi

          if [[ "${{ inputs.nomount }}" == true ]]; then
            echo "::group::NoMount integration"
            if [[ "${{ inputs.susfs }}" == true ]]; then
              echo "::warning::susfs and nomount are both enabled - susfs's SUS_KSTAT patches fs/stat.c, which nomount's own VFS hooks may also touch. If anything below fails, try disabling one to isolate it."
            fi

            # kernel/README.md documents "patch -p1 < ..._kernel_integration.patch",
            # but a full recursive search of a fresh clone (see a prior run's log)
            # found zero .patch/.diff files anywhere in the repo - that instruction
            # is stale. The repo instead ships kernel/setup.sh: the same curl-pipe-
            # bash install convention KernelSU/KernelSU-Next/SukiSU-Ultra all use
            # above in this same job, so integrate the same way rather than
            # hunting for a static patch that no longer exists.
            curl -LSs "https://raw.githubusercontent.com/kingD2N/nomount/master/kernel/setup.sh" | bash
            echo "CONFIG_NOMOUNT=y" >> arch/arm64/configs/gki_defconfig
            echo "::endgroup::"
          fi

          if [[ "${{ inputs.BBG }}" == true ]]; then
            wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
            echo "CONFIG_BBG=y" >> arch/arm64/configs/gki_defconfig
            sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          fi

          if [[ "${{ inputs.rekernel_netlink }}" == true ]]; then
            git clone --depth=1 https://github.com/Sakion-Team/Re-Kernel.git rekernel-src
            bash rekernel-src/Integrate/patches.sh
            echo "CONFIG_REKERNEL=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_REKERNEL_NETWORK=y" >> arch/arm64/configs/gki_defconfig
          fi

          if [[ "${{ inputs.rekernel_ebpf }}" == true ]]; then
            # Prereqs for the "Build Re-Kernel (eBPF)" step below: BTF so
            # bpftool can dump a vmlinux.h from our own out/vmlinux (needs
            # DEBUG_INFO_BTF; pahole/dwarves is already installed in the deps
            # step above), plus the syscall/JIT/kprobe+uprobe/cgroup+tc attach
            # points the eBPF program itself needs. Nothing else touches the
            # kernel source/defconfig here — the eBPF build itself happens
            # later, once out/vmlinux exists, and doesn't patch binder.c, so
            # it's safe to run alongside Netlink above.
            echo "CONFIG_BPF_SYSCALL=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_BPF_JIT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_CGROUP_BPF=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_BPF_EVENTS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KPROBES=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_UPROBE_EVENTS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_CLS_ACT=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_CLS_BPF=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_ACT_BPF=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_NET_SCH_INGRESS=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_DEBUG_INFO=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_DEBUG_INFO_BTF=y" >> arch/arm64/configs/gki_defconfig
            echo "CONFIG_DEBUG_INFO_BTF_MODULES=y" >> arch/arm64/configs/gki_defconfig
            echo "==> Re-Kernel eBPF selected; will build after the kernel Image is ready."
          fi

          DROIDSPACES_CONFIG=""
          if [[ "${{ inputs.droidspaces }}" == true ]]; then
            # ingres (sm8450) ships GKI kernel 5.10 -> DroidSpaces 5.10 patch path.
            # Per DroidSpaces-OSS's own docs these kABI patches are NOT optional on
            # GKI: enabling CONFIG_SYSVIPC/CONFIG_IPC_NS/CONFIG_POSIX_MQUEUE without
            # them applied can bootloop the device. Some kernel_source branches do
            # carry the fix natively though, which makes the patch a clean no-op
            # there. So for each patch: try forward first; if that fails, check
            # reverse-apply to confirm it's genuinely already present (not just
            # "didn't apply for some other reason") before treating it as fine.
            # Only enable the DroidSpaces config fragment below if BOTH patches
            # come back confirmed either way - if either is a genuine unknown,
            # skip the whole fragment rather than risk shipping an unsafe kernel.
            apply_droidspaces_patch() {
              local patch_file="$1" label="$2"
              if patch -p1 -N --fuzz=0 --dry-run --silent < "$patch_file" > /dev/null 2>&1; then
                patch -p1 -N --fuzz=0 < "$patch_file"
                echo "==> DroidSpaces ${label}: applied."
                return 0
              elif patch -p1 -R --fuzz=0 --dry-run --silent < "$patch_file" > /dev/null 2>&1; then
                echo "==> DroidSpaces ${label}: already present natively on this branch (confirmed via reverse-check) - not re-applying."
                return 0
              else
                echo "::warning::DroidSpaces ${label} doesn't apply cleanly in either direction - can't confirm the kABI fix is actually present on this tree."
                return 1
              fi
            }

            DROIDSPACES_SAFE=true

            curl -sLo patch-for-below-6.12.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
            apply_droidspaces_patch patch-for-below-6.12.patch "patch 001 (sysvipc kabi fix)" || DROIDSPACES_SAFE=false

            curl -sLo patch-for-5.10-or-lower.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
            apply_droidspaces_patch patch-for-5.10-or-lower.patch "patch 002 (posix_mqueue abi padding)" || DROIDSPACES_SAFE=false

            if [[ "$DROIDSPACES_SAFE" == true ]]; then
              if [[ -f "${GITHUB_WORKSPACE}/configs/droidspaces-gki.config" ]]; then
                cp ${GITHUB_WORKSPACE}/configs/droidspaces-gki.config arch/arm64/configs/vendor/droidspaces.config
                DROIDSPACES_CONFIG="vendor/droidspaces.config"
              else
                echo "::warning::configs/droidspaces-gki.config not found in this repo's root - DroidSpaces config fragment not applied (nothing to enable it with). Add that file to the repo (see ravindu644/Droidspaces-OSS 'Configuring GKI Kernels' docs) to actually turn DroidSpaces on."
              fi
            else
              echo "::warning::Skipping the DroidSpaces config fragment entirely this run - at least one required kABI patch could not be confirmed. Enabling CONFIG_SYSVIPC/CONFIG_IPC_NS/CONFIG_POSIX_MQUEUE without it risks a bootloop per DroidSpaces-OSS's own docs, so this run won't have working DroidSpaces support."
            fi
          fi

          KERNEL_BASE_VERSION="$(make -s kernelversion)"
          echo "KERNEL_BASE_VERSION=${KERNEL_BASE_VERSION}" >> $GITHUB_ENV
          echo "==> Kernel base terdeteksi dari Makefile: ${KERNEL_BASE_VERSION}"

          echo "-${KERNEL_NAME}-${{ github.actor }}" > .scmversion

          echo "CONFIG_TMPFS_XATTR=y" >> arch/arm64/configs/gki_defconfig

          make O=out gki_defconfig vendor/waipio_GKI.config vendor/xiaomi_GKI.config vendor/ingres_GKI.config vendor/debugfs.config ${DROIDSPACES_CONFIG}

          echo "::group::Sanity-check defconfig (savedefconfig)"
          # `make <fragments>` di atas cuma nge-merge & nulis .config mentah.
          # savedefconfig di sini yang beneran nyuruh Kconfig resolve semua
          # dependency (select/depends on), dan otomatis buang symbol yang
          # gak valid/gak eksis di tree ini. Kalau ada config yang kita mau
          # (misal tuning gaming) ternyata ke-drop, ketauan DI SINI - bukan
          # setelah nunggu 1-2 jam `make Image` kelar.
          make O=out savedefconfig
          cp out/defconfig "${GITHUB_WORKSPACE}/resolved_defconfig.txt"

          echo "--- Cek symbol kunci ingres / tuning gaming tetap ke-resolve ---"
          for cfg in \
            CONFIG_ARCH_QCOM \
            CONFIG_ARCH_WAIPIO \
            CONFIG_SCHED_WALT \
            CONFIG_QCOM_KGSL \
            CONFIG_BINDER_PRIO \
            CONFIG_MQ_IOSCHED_KYBER \
            CONFIG_MQ_IOSCHED_DEADLINE \
            CONFIG_HZ_500 \
            CONFIG_KSU_SUSFS \
            CONFIG_BBG \
            CONFIG_REKERNEL \
            CONFIG_NOMOUNT \
          ; do
            hit=$(grep "^${cfg}=" out/defconfig || true)
            if [[ -n "$hit" ]]; then
              echo "✅ ${hit}"
            else
              echo "⚠️  ${cfg} tidak ada di hasil resolve (dependency belum kepenuhi, atau symbol memang gak ada di tree ini - cek manual kalau ini config yang kamu harap ada)"
            fi
          done
          echo "::endgroup::"

          # ccache must be injected via make command-line CC (LLVM=1 overrides the env CC otherwise)
          make -j$(nproc) O=out CC="ccache ${CLANG_ROOT}/clang" HOSTCC="ccache ${CLANG_ROOT}/clang" Image

          echo "ccache status after build:"
          ccache -s

      - name: Verifikasi kompatibilitas simbol vs modul asli MIUI 14
        run: |
          # verify_miui14_compat.py + miui14_reference_symvers.json harus ada di root
          # repo workflow ini (kingD2N/Kernel), sudah ter-checkout di step "Check Out"
          # paling awal. Referensi CRC diekstrak langsung dari dump firmware nyata
          # (missi_phone_cn-user-13-TKQ1.220807.001-V14.0.23.8.14.DEV-release-keys,
          # vermagic 5.10.81-gki-g83b69c4d8214) -- bukan tebakan.
          python3 "${{ github.workspace }}/verify_miui14_compat.py" "${SOC}/out/Module.symvers" | tee /tmp/miui14_compat_report.txt
          MISMATCH_COUNT=$(grep -c "^  " /tmp/miui14_compat_report.txt || true)
          COCOK_LINE=$(grep "Cocok " /tmp/miui14_compat_report.txt | grep -oE '[0-9]+' | head -1)
          TIDAK_COCOK_LINE=$(grep "TIDAK COCOK" /tmp/miui14_compat_report.txt | grep -oE '[0-9]+' | head -1)
          echo "MIUI14_COMPAT_MATCH=${COCOK_LINE:-?}" >> $GITHUB_ENV
          echo "MIUI14_COMPAT_MISMATCH=${TIDAK_COCOK_LINE:-?}" >> $GITHUB_ENV

      - name: Save ccache
        if: ${{ always() && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ inputs.kernel_branch }}

      - name: Upload resolved defconfig (debug artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resolved-defconfig-${{ inputs.ksu_type }}
          path: resolved_defconfig.txt
          if-no-files-found: warn

      - name: Upload laporan kompatibilitas MIUI 14
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: miui14-compat-report
          path: /tmp/miui14_compat_report.txt
          if-no-files-found: warn

      - name: Build Re-Kernel (eBPF)
        if: ${{ inputs.rekernel_ebpf }}
        run: |
          set -e

          # Everything downloaded/extracted for this step lives under its own
          # subfolder so it never touches $GITHUB_WORKSPACE's root — a stray
          # *.zip there (e.g. the NDK archive) would break the `ls *.zip`
          # glob the release step uses to find the kernel zip.
          mkdir -p rekernel-ebpf-build
          cd rekernel-ebpf-build

          # ---- Host bpftool (static, decoupled from the runner's own kernel) ----
          # Used to dump BTF type info from the vmlinux we just built into a C header.
          curl -sSL -o bpftool.tar.gz \
            https://github.com/libbpf/bpftool/releases/download/v7.5.0/bpftool-v7.5.0-amd64.tar.gz
          mkdir -p bpftool-bin
          tar -xzf bpftool.tar.gz -C bpftool-bin
          chmod +x bpftool-bin/bpftool

          # ---- Android NDK r27d (eBPF-Source/Makefile's default NDK toolchain) ----
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip

          # ---- Fetch only the eBPF-Source subfolder from Re-Kernel ----
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/Sakion-Team/Re-Kernel.git rekernel-ebpf-src
          cd rekernel-ebpf-src
          git sparse-checkout set eBPF-Source
          cd eBPF-Source

          # ---- Device-specific vmlinux.h, from the kernel we just built ----
          # (README says pull /sys/kernel/btf/vmlinux off a running device; using
          # our own freshly-built vmlinux is equivalent and exactly matches what
          # will actually be flashed).
          "${GITHUB_WORKSPACE}/rekernel-ebpf-build/bpftool-bin/bpftool" btf dump file \
            "${GITHUB_WORKSPACE}/${SOC}/out/vmlinux" format c > include/vmlinux.h

          NDK_PATH="${GITHUB_WORKSPACE}/rekernel-ebpf-build/android-ndk-r27d"

          if ! make ARCH=aarch64 API=35 NDK_PATH="${NDK_PATH}"; then
            echo "::warning::Re-Kernel eBPF build failed with plain vmlinux.h — retrying with EXTRA_BPF_CFLAGS=-DRK_DEFINE_BINDER_TYPES (binder structs may be missing from our BTF dump)."
            make clean
            make ARCH=aarch64 API=35 NDK_PATH="${NDK_PATH}" EXTRA_BPF_CFLAGS=-DRK_DEFINE_BINDER_TYPES
          fi

          mkdir -p "${GITHUB_WORKSPACE}/rekernel-ebpf-out"
          cp out/rekernel.bpf.o "${GITHUB_WORKSPACE}/rekernel-ebpf-out/"
          cp out/rekerneld_aarch64 "${GITHUB_WORKSPACE}/rekernel-ebpf-out/"

      - name: Make AnyKernel3
        run: |
          ZIP_NAME="${KERNEL_NAME}_${{ inputs.ksu_type }}"

          if [[ "${{ inputs.susfs }}" == true ]]; then
            ZIP_NAME="${ZIP_NAME}_SuSFS"
          fi

          if [[ "${{ inputs.nomount }}" == true ]]; then
            ZIP_NAME="${ZIP_NAME}_NoMount"
          fi

          ZIP_NAME="${ZIP_NAME}_$(date -u +"%Y%m%d_%H%M")"
          git clone https://github.com/kingD2N/AnyKernel3.git

          cp ${SOC}/out/arch/arm64/boot/Image AnyKernel3/Image
          cp ${SOC}/out/arch/arm64/boot/Image ./Image
          cd AnyKernel3

          zip -r9 ../"${ZIP_NAME}.zip" * -x .git

      - name: Create GitHub Release
        run: |
          BUILD_TIME=$(date -u +"%Y%m%d_%H%M")
          REL_NAME="${KERNEL_NAME}-${BUILD_TIME}"
          echo "REL_NAME=${REL_NAME}" >> $GITHUB_ENV
          cd ${GITHUB_WORKSPACE}
          ZIP_FILE=$(ls *.zip)

          ASSETS=("${ZIP_FILE}")
          if [[ "${{ inputs.rekernel_ebpf }}" == true ]]; then
            ASSETS+=("rekernel-ebpf-out/rekernel.bpf.o" "rekernel-ebpf-out/rekerneld_aarch64")
          fi

          if [[ "${{ inputs.susfs }}" == true ]]; then
            susfs_checkbox="Supported (susfs4ksu@${SUSFS_COMMIT})"
          else
            susfs_checkbox="Unsupported"
          fi

          if [[ "${{ inputs.BBG }}" == true ]]; then
            bbg_checkbox="Supported"
          else
            bbg_checkbox="Unsupported"
          fi

          if [[ "${{ inputs.rekernel_netlink }}" == true ]]; then
            rekernel_netlink_checkbox="Supported"
          else
            rekernel_netlink_checkbox="Unsupported"
          fi

          if [[ "${{ inputs.rekernel_ebpf }}" == true ]]; then
            rekernel_ebpf_checkbox="Supported (daemon+prog attached as release assets)"
          else
            rekernel_ebpf_checkbox="Unsupported"
          fi

          if [[ "${{ inputs.droidspaces }}" == true ]]; then
            droidspaces_checkbox="Supported"
          else
            droidspaces_checkbox="Unsupported"
          fi

          if [[ "${{ inputs.nomount }}" == true ]]; then
            nomount_checkbox="Supported (research/dev - kingD2N/nomount)"
          else
            nomount_checkbox="Unsupported"
          fi

          cat > release_notes.md << NOTES_EOF
          #

          <img width="512" height="279" alt="image_0c69b253-1d7c-4fda-9f53-08ba18f46a10" src="https://github.com/user-attachments/assets/ba10704d-00c8-45d1-bde0-bd8bdb3618d2" />

          | | |
          |:---|:---|
          | 📱 Device | POCO F4 GT (ingres) • Redmi K50G (ingres) |
          | 🟠 ROM Support | MIUI 14 (stock) |
          | 🧪 Cek Kompatibilitas MIUI 14 | ${{ env.MIUI14_COMPAT_MATCH }} simbol cocok / ${{ env.MIUI14_COMPAT_MISMATCH }} tidak cocok (vs modul asli V14.0.23.8.14 -- lihat artifact miui14-compat-report) |
          | ℹ️ Catatan | Zip ini cuma ganti kernel Image -- TIDAK mengganti/memasang ulang module vendor (.ko) apa pun. Kompatibilitas nyata bergantung pada partisi vendor MIUI 14 yang SUDAH terpasang di device, bukan pada apa pun di workflow ini. Belum diverifikasi lewat pencocokan simbol/CRC terhadap .ko asli MIUI 14 -- lihat repo utk update. |
          | 🖥️ Kernel Name | ${KERNEL_NAME} |
          | 🧬 Kernel Base | android12-${KERNEL_BASE_VERSION} |
          | 🛠️ Build Scope | ZIP |
          | 📦 Source | ${{ inputs.kernel_source }} |
          | ⚔️ Kernel branch | ${{ inputs.kernel_branch }} |
          | 💻 KSU Manager type | ${{ inputs.ksu_type }} |
          | 🔧 SuSFS Version | ${susfs_checkbox} |
          | ⚙️ BBG Patch | ${bbg_checkbox} |
          | ⚙️ Re-Kernel (Netlink) | ${rekernel_netlink_checkbox} |
          | ⚙️ Re-Kernel (eBPF) | ${rekernel_ebpf_checkbox} |
          | 🧩 DroidSpaces | ${droidspaces_checkbox} |
          | 🗂️ NoMount | ${nomount_checkbox} |
          | 🔨 Compiler | LLVM/Clang ${LLVM_VERSION} Official |

          ---
          NOTES_EOF

          gh release create "$REL_NAME" --title "$REL_NAME" --notes-file release_notes.md "${ASSETS[@]}"
